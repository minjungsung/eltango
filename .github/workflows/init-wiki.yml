name: Initialize Wiki
on:
  workflow_dispatch:
jobs:
  init-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Initialize wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "minjungsung1994@gmail.com"
          git config --global user.name "minjungsung"
          mkdir wiki && cd wiki
          git init
          echo "# Wiki" > Home.md
          echo "Initializing..." >> Home.md
          git add .
          git commit -m "docs: initialize wiki"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push -u origin master || git push -u origin main
