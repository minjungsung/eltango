name: Initialize Wiki
on:
  workflow_dispatch:
jobs:
  init-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create wiki files
        run: |
          mkdir -p wiki
          echo "# Wiki" > wiki/Home.md
          echo "Initializing..." >> wiki/Home.md
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki/
          token: ${{ secrets.GITHUB_TOKEN }}
